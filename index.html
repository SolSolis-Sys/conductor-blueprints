<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor Blueprints Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="masthead">
                <div class="masthead-top">
                    <p class="masthead-kicker">registry · index</p>
                    <div class="lang-switch" role="group" aria-label="Language / Langue">
                        <button class="lang-btn" type="button" data-lang="fr" aria-pressed="true" aria-label="Français">
                            <svg class="flag" viewBox="0 0 18 12" width="18" height="12" aria-hidden="true">
                                <rect width="6" height="12" x="0" fill="#0055A4"/>
                                <rect width="6" height="12" x="6" fill="#FFFFFF"/>
                                <rect width="6" height="12" x="12" fill="#EF4135"/>
                            </svg>
                            <span>FR</span>
                        </button>
                        <button class="lang-btn" type="button" data-lang="en" aria-pressed="false" aria-label="English">
                            <svg class="flag" viewBox="0 0 18 12" width="18" height="12" aria-hidden="true">
                                <rect width="18" height="12" fill="#012169"/>
                                <path d="M0 0L18 12M18 0L0 12" stroke="#FFFFFF" stroke-width="2.4"/>
                                <path d="M0 0L18 12M18 0L0 12" stroke="#C8102E" stroke-width="1.2"/>
                                <path d="M9 0V12M0 6H18" stroke="#FFFFFF" stroke-width="3.6"/>
                                <path d="M9 0V12M0 6H18" stroke="#C8102E" stroke-width="2"/>
                            </svg>
                            <span>EN</span>
                        </button>
                    </div>
                </div>
                <h1 class="masthead-lockup">
                    <span class="wordmark">Conductor</span><span class="masthead-sub">Blueprints</span>
                </h1>
                <p class="masthead-count">
                    <span class="masthead-dot" aria-hidden="true">●</span>
                    <span id="registry-count">0</span> <span data-i18n="countLabel">blueprints indexés</span>
                </p>
            </div>

            <div class="toolbar">
                <input
                    type="search"
                    class="search-bar"
                    placeholder="Rechercher un blueprint (nom, description, tag, auteur)…"
                    data-i18n-ph="searchPlaceholder"
                    data-i18n-al="searchAria"
                    aria-label="Rechercher un blueprint">

                <label class="sort-control">
                    <span class="sort-label" data-i18n="sortLabel">Trier</span>
                    <select class="sort-select" id="sort-select" aria-label="Trier les blueprints">
                        <option value="recent" data-i18n="sortRecent">Récents</option>
                        <option value="votes" data-i18n="sortVotes">Populaires</option>
                    </select>
                </label>
            </div>

            <div class="filters" id="filter-tags" role="group" aria-label="Filtrer par tag">
                <!-- Les filtres de tags sont générés dynamiquement via app.js -->
            </div>
        </header>

        <main class="cards-grid" id="blueprints-grid" aria-live="polite">
            <!-- Les cards sont générées dynamiquement via app.js -->
        </main>

        <a class="submit-btn" id="submit-blueprint" href="web/submit.html" data-i18n="submitBtn">Soumettre un Blueprint</a>
    </div>

    <div class="modal-overlay" id="detail-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" id="modal-close" type="button" data-i18n-al="closeAria" aria-label="Fermer le détail">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
            </button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
